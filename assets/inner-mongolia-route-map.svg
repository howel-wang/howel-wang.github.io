<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">北京到内蒙古 5 日自驾路线</title>
  <desc id="desc">路线从北京出发，经乌兰察布、包头、鄂尔多斯、大同后返回北京。</desc>
  <defs>
    <linearGradient id="land" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f1e7"/>
      <stop offset="1" stop-color="#e7efe4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6b5a44" flood-opacity=".18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b95a3f"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#land)"/>
  <path d="M0 575 C145 520 210 555 345 505 C470 460 565 485 690 430 C805 380 945 390 1085 315 C1180 265 1230 250 1280 235" fill="none" stroke="#d8c7a6" stroke-width="3" opacity=".45"/>
  <path d="M0 250 C130 210 255 225 360 180 C485 126 575 155 705 112 C845 67 975 95 1110 54 C1180 33 1235 30 1280 22" fill="none" stroke="#ffffff" stroke-width="42" opacity=".22"/>
  <path d="M80 642 C210 620 300 638 420 602 C530 570 625 585 742 540 C850 500 982 515 1160 460" fill="none" stroke="#98b7c7" stroke-width="5" opacity=".38"/>
  <path d="M150 420 C260 350 365 335 478 355 C610 378 708 345 820 285 C946 218 1055 222 1170 175" fill="none" stroke="#d6a77b" stroke-width="2" opacity=".35"/>
  <path d="M255 215 C385 242 505 238 640 205 C760 176 860 168 990 185 C1088 198 1180 190 1265 165" fill="none" stroke="#d6a77b" stroke-width="2" opacity=".28"/>

  <g fill="none" stroke="#b95a3f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M1095 415 L780 235"/>
    <path d="M780 235 L525 315"/>
    <path d="M525 315 L445 478"/>
    <path d="M445 478 L735 445"/>
    <path d="M735 445 L1095 415"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 12" opacity=".82">
    <path d="M1095 415 L780 235 L525 315 L445 478 L735 445 L1095 415"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g filter="url(#shadow)">
      <rect x="24" y="22" width="338" height="78" rx="8" fill="#ffffff" opacity=".96"/>
      <text x="44" y="58" font-size="22" font-weight="700" fill="#1f2a24">北京到内蒙古 5 日自驾路线</text>
      <text x="44" y="84" font-size="15" fill="#68746a">北京 · 乌兰察布 · 包头 · 鄂尔多斯 · 大同 · 北京</text>
    </g>

    <g transform="translate(1095 415)">
      <circle r="19" fill="#b95a3f" stroke="#fff" stroke-width="4"/>
      <text y="7" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">京</text>
      <rect x="28" y="-28" width="98" height="42" rx="7" fill="#fff" filter="url(#shadow)"/>
      <text x="42" y="-2" font-size="17" font-weight="700" fill="#1f2a24">1. 北京</text>
    </g>

    <g transform="translate(780 235)">
      <circle r="19" fill="#b95a3f" stroke="#fff" stroke-width="4"/>
      <text y="7" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">乌</text>
      <rect x="26" y="-28" width="132" height="42" rx="7" fill="#fff" filter="url(#shadow)"/>
      <text x="40" y="-2" font-size="17" font-weight="700" fill="#1f2a24">2. 乌兰察布</text>
    </g>

    <g transform="translate(525 315)">
      <circle r="19" fill="#b95a3f" stroke="#fff" stroke-width="4"/>
      <text y="7" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">包</text>
      <rect x="24" y="-32" width="100" height="42" rx="7" fill="#fff" filter="url(#shadow)"/>
      <text x="38" y="-6" font-size="17" font-weight="700" fill="#1f2a24">3. 包头</text>
    </g>

    <g transform="translate(445 478)">
      <circle r="19" fill="#b95a3f" stroke="#fff" stroke-width="4"/>
      <text y="7" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">鄂</text>
      <rect x="26" y="-30" width="132" height="42" rx="7" fill="#fff" filter="url(#shadow)"/>
      <text x="40" y="-4" font-size="17" font-weight="700" fill="#1f2a24">4. 鄂尔多斯</text>
    </g>

    <g transform="translate(735 445)">
      <circle r="19" fill="#b95a3f" stroke="#fff" stroke-width="4"/>
      <text y="7" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">同</text>
      <rect x="26" y="-64" width="100" height="42" rx="7" fill="#fff" filter="url(#shadow)"/>
      <text x="40" y="-38" font-size="17" font-weight="700" fill="#1f2a24">5. 大同</text>
    </g>
  </g>
</svg>
